# Render Blueprint — deploys Veridian with durable account storage.
#
# First-time setup (one-time, ~5 minutes):
#   1. Create a free Postgres database (Neon works well and has no expiry:
#      https://neon.tech — create a project, copy the connection string).
#   2. In Render: New > Blueprint > select this repo. When prompted for
#      DATABASE_URL, paste the Postgres connection string.
#   3. SESSION_SECRET is generated automatically by Render.
#
# After that, every push to main redeploys automatically and accounts persist.
services:
  - type: web
    name: veridian
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
